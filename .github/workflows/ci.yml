name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: catches newly published vulnerabilities in unchanged dependencies

permissions:
  contents: read  # every job only reads the repository; nothing here needs write access

# Runner image is named rather than ubuntu-latest, so an image change is a deliberate one-line edit.

jobs:
  python:
    name: Engine and API tests (Python ${{ matrix.python }})
    runs-on: &runner ubuntu-26.04  # defined once here; the other jobs reuse it
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # README minimum and the version used for development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        # No provider is configured here, so explanations stay disabled and nothing calls an external API.

  vulnerabilities:
    name: Known vulnerabilities in dependencies
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web

  web:
    name: Dashboard build
    runs-on: *runner
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  container:
    name: Container builds
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t trueacre:ci .

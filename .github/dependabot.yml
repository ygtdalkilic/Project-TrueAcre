# Automatic pull requests for dependency updates, so known vulnerabilities are patched quickly.
# Routine minor and patch updates arrive as one grouped pull request per ecosystem per week. Major updates
# still come one at a time, so each breaking change gets its own review. Security updates are not grouped:
# each one still opens its own pull request as soon as an advisory affects a dependency.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:  # also keeps react and react-dom on the same version, which they require
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
